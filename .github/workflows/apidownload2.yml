name: apidownload2

on:
  schedule:
    - cron: '5 16 * * *'    # UTC 16:05 = 北京时间 00:05
  workflow_dispatch:
    inputs:
      debug:
        description: "调试模式"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 奇偶日 gate（每两日执行）
        id: gate
        run: |
          DAY=$(date -u +%d)
          if [ $((10#$DAY % 2)) -eq 0 ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: 运行脚本
        working-directory: ${{ github.workspace }}
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python python/apidownload2.py --debug
          else
            python python/apidownload2.py
          fi

      - name: 提交结果
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox/ list.txt SUMMARY.txt tvboxapilinks.txt || true
          if git diff --cached --quiet; then echo "无变更"; exit 0; fi
          git commit -m "chore: 每两日自动抓取更新 ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
